name: Check Release Automation

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-checks.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test version planning, retry recovery and draft publication
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
