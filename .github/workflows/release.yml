name: Build Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (already prepared higher versions are retained)
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}
      CORE_NAME: ${{ vars.PACKAGE_NAME_CORE }}
    steps:
      - name: Checkout main and release history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare version commit and tag
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/prepare_release.py \
            --package-name "$PACKAGE_NAME" --core-name "$CORE_NAME" \
            --bump "$BUMP" --run-id "$RELEASE_RUN_ID" --source-sha "$RELEASE_SOURCE_SHA"

      - name: Set artifact names
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_CORE_VERSION: ${{ steps.prepare.outputs.core_version }}
        run: |
          echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "CORE_VERSION=$RELEASE_CORE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_PATH=Packages/$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "CORE_PATH=Packages/$CORE_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_ZIP=$PACKAGE_NAME-$RELEASE_VERSION.zip" >> "$GITHUB_ENV"
          echo "CORE_ZIP=$CORE_NAME-$RELEASE_CORE_VERSION.zip" >> "$GITHUB_ENV"
          echo "UNITY_PACKAGE=$PACKAGE_NAME-$RELEASE_VERSION.unitypackage" >> "$GITHUB_ENV"

      - name: Check for an already published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/publish_release.py status \
            --version "$VERSION" --core-version "$CORE_VERSION" \
            --package-name "$PACKAGE_NAME" --core-name "$CORE_NAME"

      - name: Create package ZIP
        if: steps.release.outputs.published != 'true'
        working-directory: ${{ env.PACKAGE_PATH }}
        run: zip -r "$GITHUB_WORKSPACE/$PACKAGE_ZIP" .

      - name: Create core ZIP
        if: steps.release.outputs.published != 'true'
        working-directory: ${{ env.CORE_PATH }}
        run: zip -r "$GITHUB_WORKSPACE/$CORE_ZIP" .

      - name: Collect UnityPackage metadata
        if: steps.release.outputs.published != 'true'
        run: find "$PACKAGE_PATH/" "$CORE_PATH/" -name '*.meta' -print | sort > metaList

      - name: Create UnityPackage
        if: steps.release.outputs.published != 'true'
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.UNITY_PACKAGE }}
          include-files: metaList

      - name: Upload draft assets and publish
        if: steps.release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/publish_release.py publish \
            --version "$VERSION" --core-version "$CORE_VERSION" \
            --package-name "$PACKAGE_NAME" --core-name "$CORE_NAME"

      - name: Release summary
        env:
          RELEASE_COMMIT: ${{ steps.prepare.outputs.commit }}
          RELEASE_REUSED: ${{ steps.prepare.outputs.reused }}
          ALREADY_PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          {
            echo "### TextureCocktail $VERSION"
            echo "- Core: $CORE_VERSION"
            echo "- Commit: $RELEASE_COMMIT"
            echo "- Reused this run's version: $RELEASE_REUSED"
            echo "- Already published before this attempt: $ALREADY_PUBLISHED"
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
